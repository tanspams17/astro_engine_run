name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-smoke-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astro-engine/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Matches deploy/Dockerfile's apt-get list — WeasyPrint needs these
      # to import at all, so a plain `pip install` isn't enough to catch
      # a broken PDF pipeline.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libcairo2 \
            libgdk-pixbuf-2.0-0 libffi8 shared-mime-info fonts-dejavu-core

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Syntax-check every backend module
        run: python -m compileall -q .

      - name: Boot the app and hit /api/health
        env:
          ARVELOS_DATA_DIR: /tmp/arvelos-ci-data
        run: |
          uvicorn app:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8000/api/health && exit 0
            sleep 1
          done
          echo "app never became healthy" && exit 1
