services:
  arvelos-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: arvelos-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8801:8000"   # localhost only; Nginx fronts it
    volumes:
      - arvelos_data:/data
    environment:
      - ARVELOS_DB=/data/arvelos.db
      - ARVELOS_DATA_DIR=/data
      - ARVELOS_FRONTEND=/app/frontend
      - BASE_URL=https://astro.arvelos.cloud
      - ARVELOS_ALLOWED_ORIGINS=https://astro.arvelos.cloud
      - SUPPORT_EMAIL=support@arvelos.cloud
      # Gateway is picked per order by currency (INR -> Razorpay, else ->
      # Stripe) and falls back to the mock adapter automatically when a
      # gateway's keys below are unset — so leaving all four commented out
      # keeps the whole site on dummy payments. Uncomment PAYMENT_PROVIDER
      # instead to force mock everywhere regardless of keys (e.g. staging).
      # - PAYMENT_PROVIDER=mock
      # - STRIPE_API_KEY=sk_test_xxxxxxxxxxxx
      # - STRIPE_WEBHOOK_SECRET=whsec_xxxxxxxxxxxx
      # - RAZORPAY_KEY_ID=rzp_test_xxxxxxxxxxxx
      # - RAZORPAY_KEY_SECRET=xxxxxxxxxxxx
      # - RAZORPAY_WEBHOOK_SECRET=xxxxxxxxxxxx
      # SMTP — set these when the mail provider is chosen:
      # - SMTP_HOST=smtp.postmarkapp.com
      # - SMTP_PORT=587
      # - SMTP_USER=...
      # - SMTP_PASS=...
      # - SMTP_FROM=Arvelos <reports@astro.arvelos.cloud>

volumes:
  arvelos_data:
