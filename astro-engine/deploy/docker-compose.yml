services:
  arvelos-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: arvelos-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8801:8000"   # localhost only; Nginx fronts it
    volumes:
      - arvelos_data:/data
    environment:
      - ARVELOS_DB=/data/arvelos.db
      - ARVELOS_DATA_DIR=/data
      - ARVELOS_FRONTEND=/app/frontend
      - BASE_URL=https://astro.arvelos.cloud
      - ARVELOS_ALLOWED_ORIGINS=https://astro.arvelos.cloud
      - SUPPORT_EMAIL=support@arvelos.cloud
      # Gateway is picked per order by currency (INR -> Razorpay, else ->
      # Stripe) and falls back to the mock adapter automatically when a
      # gateway's keys below are unset — so leaving all five blank in .env
      # (or omitting .env entirely) keeps the whole site on dummy payments.
      # Real values live in deploy/.env (untracked, see .env.example) —
      # never commit secrets into this file, it's version controlled.
      - PAYMENT_PROVIDER=${PAYMENT_PROVIDER:-}
      - STRIPE_API_KEY=${STRIPE_API_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET:-}
      # Email: Resend (HTTP API) is the chosen provider — blank keeps
      # writing to the outbox instead of sending. Requires the sending
      # domain verified in the Resend dashboard first.
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEND_FROM=${RESEND_FROM:-Arvelos <reports@arvelos.cloud>}
      # Legacy SMTP path (only used if RESEND_API_KEY is unset):
      # - SMTP_HOST=smtp.postmarkapp.com
      # - SMTP_PORT=587
      # - SMTP_USER=...
      # - SMTP_PASS=...
      # - SMTP_FROM=Arvelos <reports@arvelos.cloud>

volumes:
  arvelos_data:
